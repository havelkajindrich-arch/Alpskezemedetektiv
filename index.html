n; Swiss citizens are the largest foreign-national group.", "Roman Catholic Christianity is the largest religious affiliation.", "Record Vaduz (capital) and Schaan (industry); specialised manufacturing and financial services are important."], "sources": [{"label": "Statistics Liechtenstein — corrected population release 2024", "url": "https://www.statistikportal.li/de/publikation/211-bevoelkerungsstand/2024/03/v-2/p33902"}, {"label": "Statistics Liechtenstein — GDP estimate", "url": "https://www.statistikportal.li/de/news/wirtschaftsleistung-gestiegen"}, {"label": "Statistics Liechtenstein — population structure", "url": "https://www.statistikportal.li/de/themen/bevoelkerung/bevoelkerungsstruktur"}, {"label": "Official tourism — facts and area", "url": "https://en.tourismus.li/reiseland/unser-land/zahlen-fakten.html"}], "quiz": [{"type": "choice", "prompt": "Which list gives all of Liechtenstein's neighbours?", "options": ["Switzerland and Italy", "Austria and Switzerland", "Germany and Austria"], "answer": 1, "explain": "There are 2: Austria, Switzerland."}, {"type": "choice", "prompt": "Which population belongs in this case file (2024/start of 2025)?", "options": ["About 4.09 million", "About 40,900", "About 409,000"], "answer": 1, "explain": "40,886 residents; reference date: 31 December 2024; permanent residents."}, {"type": "number", "prompt": "Divide the case-file population by 160 km² of total area. Round to the nearest whole person per km².", "answer": 256, "tolerance": 0.5, "explain": "Density ≈ 256 people/km². This calculation uses total national area, not land area excluding water."}, {"type": "choice", "prompt": "Which nominal GDP figure matches this country in 2024?", "options": ["€494 billion", "CHF 854 billion", "CHF 7.8 billion"], "answer": 2, "explain": "CHF 7.8 billion (2024; provisional). These are local-currency figures: do not compare raw euro and franc totals without conversion."}, {"type": "choice", "prompt": "Which is the largest religious tradition in the country?", "options": ["Buddhism", "Islam", "Christianity, with Roman Catholicism its largest denomination"], "answer": 2, "explain": "Christianity; Roman Catholicism is the largest denomination."}, {"type": "choice", "prompt": "Which citizenship forms the largest group among foreign-national residents?", "options": ["Italian citizens", "Swiss citizens", "German citizens"], "answer": 1, "explain": "Swiss citizens — largest foreign-national group (27.0% of foreign residents, end 2024). Foreign nationality is not the same as birthplace, ethnicity or all migration backgrounds."}, {"type": "choice", "prompt": "Which language is official nationwide?", "options": ["Italian", "German", "French"], "answer": 1, "explain": "German is the official language; Alemannic dialects are widely spoken."}]}};
const TERRAIN={"at": {"mountain": {"title": "Grossglockner crime scene", "place": "Hohe Tauern, Austria", "mapQuery": "Kaiser-Franz-Josefs-Höhe Grossglockner Austria", "image": "grossglockner.jpg", "report": "Detectives, the theft occurred near Grossglockner, Austria’s highest mountain at 3,798 m. Expect steep rocky ridges, glacial valleys and the Pasterze glacier. Higher ground is colder: at 3,100 m in the glacier region, the 1991–2020 annual mean was about −4.5°C. Forests give way to alpine grassland, then sparse plants, rock and ice. Pasterze meltwater drains towards the Möll. Search a valley settlement or a mountain hut rather than assuming the suspect remains on the summit. A dropped postcard points to Lake Neusiedl.", "notes": ["Grossglockner: Austria’s highest mountain, 3,798 m.", "Relief: steep ridges, glacial valleys and Pasterze glacier; meltwater drains to the Möll.", "With increasing altitude: lower temperatures and a shorter growing season; forest → alpine grassland → sparse plants, rock and ice.", "The −4.5°C figure is a 1991–2020 annual mean at 3,100 m in the glacier region, not today’s summit temperature."], "quiz": [{"type": "choice", "prompt": "Which sequence normally describes vegetation from lower slopes upwards?", "options": ["Forest → alpine grassland → sparse plants, rock and ice", "Bare rock → rainforest → reed beds", "Alpine grassland → forest → vineyards"], "answer": 0, "explain": "As altitude increases, lower temperatures shorten the growing season and eventually prevent tree growth."}, {"type": "choice", "prompt": "Which river receives drainage from the Pasterze glacier?", "options": ["The Rhine", "The Möll", "The Wulka"], "answer": 1, "explain": "The report identifies the Möll as the glacier’s drainage route."}], "sources": [{"label": "Hohe Tauern habitats", "url": "https://hohetauern.at/en/nature/habitats.html"}, {"label": "World Glacier Monitoring Service — Pasterze", "url": "https://wgms.ch/products_ref_glaciers/pasterze-alps/"}]}, "lowland": {"title": "Lake Neusiedl postcard", "place": "Rust, Neusiedler See, Austria", "mapQuery": "Seebad Rust Neusiedler See Austria", "image": "neusiedler-see.jpg", "report": "The postcard shows a very different Austria. Lake Neusiedl lies about 115 m above sea level on the Hungarian border. It is a shallow steppe lake surrounded by broad reed beds, wetlands, grasslands and vineyards. The Pannonian climate has warm summers, colder winters and relatively low rainfall; the annual mean temperature exceeds 10°C. The Wulka flows into the lake, but precipitation supplies most of its water. The suspect could hide near a lakeside village, reed margin or vineyard. Record how this landscape differs from Grossglockner.", "notes": ["Lake Neusiedl: shallow steppe lake at about 115 m, shared with Hungary.", "Flat lowland surroundings with reeds, wetlands, grasslands and vineyards.", "Pannonian climate: warm summers, cold winters and relatively low rainfall; much warmer on average than high Alpine terrain.", "The Wulka flows into the lake; precipitation supplies most of its water."], "quiz": [{"type": "choice", "prompt": "Which set of evidence matches this postcard?", "options": ["A deep fjord, glaciers and a Norwegian border", "A shallow steppe lake, reed beds and a Hungarian border", "A high summit, permanent ice and an Italian border"], "answer": 1, "explain": "The report places the shallow, reed-fringed lake on the Austrian–Hungarian border."}, {"type": "choice", "prompt": "Why would snow generally survive less well here than on Grossglockner?", "options": ["The lake is at much lower altitude with generally warmer conditions", "All Austrian lakes are heated artificially", "Snow can never fall in lowlands"], "answer": 0, "explain": "Lower altitude and warmer conditions generally favour melting. This does not mean the lake never freezes or the lowland never receives snow."}], "sources": [{"label": "Austria Tourism — Lake Neusiedl", "url": "https://www.austria.info/en-gb/locations/lake-neusiedl/"}, {"label": "LTER Austria — Lake Neusiedl climate", "url": "https://www.lter-austria.at/en/cwn-sites-lake-neusiedl/"}, {"label": "National park — lake and reeds", "url": "https://www.nationalparkneusiedlersee.at/media/1405/birdinghotspots_en.pdf"}]}, "postcard": "Dear accomplice, I need somewhere flat to park the snow truck. Follow the reeds towards Hungary. If the cargo melts, we can claim it is lake water. — S.T."}, "li": {"mountain": {"title": "Vorder Grauspitz crime scene", "place": "Rätikon, Liechtenstein–Switzerland border", "mapQuery": "Vorder Grauspitz Liechtenstein", "image": "vorder-grauspitz.jpg", "report": "The suspect has reached Vorder Grauspitz: 2,599 m, Liechtenstein’s highest summit, in the Rätikon range on the Swiss border. Rocky ridges and steep slopes dominate. Conditions are colder and windier than in the Rhine Valley; snow can occur even outside winter. Forests occupy lower slopes, with alpine grassland and sparse vegetation higher up. Do not confuse this rocky summit with a large glacier. Search lower valleys or mountain pastures as alternative hideouts. The recovered postcard shows a bridge over the Rhine.", "notes": ["Vorder Grauspitz: Liechtenstein’s highest summit at 2,599 m; Rätikon, on the Swiss border.", "Relief: steep rocky slopes and ridges; no large glacier should be inferred from a snowy photograph.", "Lower forests give way to alpine grassland and sparse vegetation as conditions become colder with altitude."], "quiz": [{"type": "choice", "prompt": "Which country is across the border at Vorder Grauspitz?", "options": ["Germany", "Switzerland", "Italy"], "answer": 1, "explain": "Vorder Grauspitz stands on Liechtenstein’s border with Switzerland."}, {"type": "choice", "prompt": "Does a summit at 2,599 m mean that all of Liechtenstein has a high-mountain climate?", "options": ["Yes: every place in a small country has the same climate", "No: the lower Rhine Valley is warmer and has different vegetation", "No: the valley is a tropical desert"], "answer": 1, "explain": "Large altitude differences can create contrasting climates and vegetation within a very small country."}], "sources": [{"label": "Liechtenstein Alpine Club — Grauspitz", "url": "https://www.alpenverein.li/wandern-klettern/berggipfel/grauspitz"}, {"label": "Triesen municipality — Grauspitz", "url": "https://www.triesen.li/namenbuch2.aspx?dd=A+bis+Z&name=Grauspitz&nid=0"}]}, "lowland": {"title": "The Rhine border postcard", "place": "Old Rhine Bridge, Vaduz–Sevelen", "mapQuery": "Alte Rheinbrücke Vaduz Sevelen", "image": "rhine-vaduz.jpg", "report": "Detectives, the old bridge connects Vaduz with Sevelen in Switzerland. Here the Rhine crosses a broad valley floor roughly 450 m above sea level, far below Grauspitz. Settlements, fields and transport routes occupy the flatter ground; wooded slopes rise nearby. Summers are warmer than in the mountains, but winter frost still occurs. Föhn can bring warm, dry downslope winds. The Rhine forms the western border and ultimately reaches the North Sea. Check the bridge approaches, riverside route and nearby town for the next evidence.", "notes": ["The Rhine forms Liechtenstein’s western border with Switzerland and drains towards the North Sea.", "Valley floor near Vaduz: roughly 450 m; flatter ground supports settlements, fields and transport.", "Valley conditions are milder than at Grauspitz; Föhn is a warm, dry downslope wind."], "quiz": [{"type": "choice", "prompt": "What is Föhn?", "options": ["A cold ocean current", "A warm, dry downslope wind", "A permanent glacier"], "answer": 1, "explain": "Föhn is a warm, dry wind descending from mountains into the valleys."}, {"type": "choice", "prompt": "Why do settlements and major transport routes concentrate on this valley floor?", "options": ["The flat valley makes construction and movement easier than steep mountain slopes", "Every valley lies at sea level", "The Rhine Valley has no winter"], "answer": 0, "explain": "Flatter ground and milder conditions favour settlement, agriculture and transport, although frost and other hazards remain possible."}], "sources": [{"label": "Vaduz municipality — Rhine bridge", "url": "https://www.vaduz.li/en/living-environment/living-building/listed-buildings/rheinbruecke-vaduz-sevelen"}, {"label": "Official tourism — Old Rhine Bridge", "url": "https://en.tourismus.li/map/poi/alte-rheinbrucke-e5935511-7115-400a-942f-e7a4911f3b58.html"}, {"label": "Official statistics — geography and climate", "url": "https://archiv.llv.li/files/as/fliz-englisch-2017-2nd-edition.pdf"}]}, "postcard": "Dear accomplice, meet me at the wooden bridge. One side is Liechtenstein, the other Switzerland. Please do not ask which side is colder: the snow is melting on both. — S.T."}, "ch": {"mountain": {"title": "Matterhorn crime scene", "place": "Zermatt, Switzerland–Italy border", "mapQuery": "Zermatt Matterhorn viewpoint Switzerland", "image": "matterhorn.jpg", "report": "The stolen snow was last seen near the Matterhorn, a 4,478 m peak on the Swiss–Italian border. Its sharp pyramidal form reflects erosion of rocks uplifted and stacked during Alpine mountain building. High slopes contain rock, snow and ice; freezing conditions can occur even in summer. Lower down, alpine meadows give way to mountain forests. On the Swiss side, water drains through the Zermatt valley towards the Rhône system. Consider Zermatt or a lower valley as alternative hiding places. The postcard shows Lake Geneva.", "notes": ["Matterhorn: 4,478 m, on the Swiss–Italian border; distinctive pyramidal peak.", "Alpine mountain building uplifted and stacked rocks; subsequent erosion shaped the sharp relief.", "High elevations have very cold conditions and sparse vegetation; lower slopes support alpine meadows and mountain forests.", "Swiss-side drainage joins the Rhône system."], "quiz": [{"type": "choice", "prompt": "Which explanation best accounts for the mountain’s shape and origin?", "options": ["A volcano erupted directly from Lake Geneva", "Plate collision built the mountain belt; erosion helped shape the sharp peak", "Tourists piled rocks into a pyramid"], "answer": 1, "explain": "Mountain building and the later erosion of the landscape are different processes."}, {"type": "choice", "prompt": "Which water system receives drainage from the Swiss side through the Zermatt valley?", "options": ["The Rhône system", "The Wulka system", "The Danube delta directly"], "answer": 0, "explain": "The report links Swiss-side runoff to the Rhône drainage system."}], "sources": [{"label": "Zermatt — Matterhorn", "url": "https://zermatt.swiss/en/activities/hiking-mountaineering/mountaineering/matterhorn-ascent"}, {"label": "Swiss geologists — Matterhorn rocks", "url": "https://erlebnis-geologie.ch/antworten/matterhorn/"}, {"label": "Swiss federal climate overview", "url": "https://www.aboutswitzerland.eda.admin.ch/en/climate"}]}, "lowland": {"title": "Lake Geneva postcard", "place": "Ouchy, Lausanne, Switzerland", "mapQuery": "Ouchy Lausanne Switzerland", "image": "lake-geneva.jpg", "report": "The postcard matches Ouchy, Lausanne’s lakeshore. Lake Geneva lies at an average elevation of 372 m and is shared with France. This is low ground relative to the Alps, not a sea-level plain: Lausanne rises steeply inland. The Rhône enters and leaves the lake before continuing towards the Mediterranean. The lakeshore is milder than the high Alps, with warm summers and possible winter frost. Gardens, deciduous trees and nearby vineyard slopes replace summit vegetation. Search the promenade, harbour or nearby urban streets.", "notes": ["Lake Geneva: average water elevation 372 m; shared by Switzerland and France.", "The Rhône passes through the lake and continues towards the Mediterranean Sea.", "Lausanne’s lakeshore is low relative to the Alps, but it is not at sea level; the city rises inland.", "Milder lakeshore conditions support deciduous trees, gardens and nearby vineyards; winter frost remains possible."], "quiz": [{"type": "choice", "prompt": "Which statement correctly describes this ‘lowland’?", "options": ["It is below sea level throughout", "It is lower than the nearby Alps but still hundreds of metres above sea level", "It is a flat plateau above 4,000 m"], "answer": 1, "explain": "The lake lies at an average elevation of 372 m, while the nearby Alpine peaks rise thousands of metres higher."}, {"type": "choice", "prompt": "Which combination correctly follows the lake’s river and its final destination?", "options": ["Rhine → Baltic Sea", "Rhône → Mediterranean Sea", "Wulka → Arctic Ocean"], "answer": 1, "explain": "The Rhône enters and leaves Lake Geneva and ultimately reaches the Mediterranean."}], "sources": [{"label": "CIPEL — Lake Geneva facts", "url": "https://www.cipel.org/en/le-leman/"}, {"label": "Lausanne Tourism — Ouchy", "url": "https://www.lausanne-tourisme.ch/en/explore/ouchy/"}, {"label": "Swiss climate centre — Swiss Plateau", "url": "https://www.nccs.admin.ch/nccs/en/home/regions/grossregionen/swiss-plateau.html"}]}, "postcard": "Dear accomplice, the mountain freezer is broken. Meet me beside the big lake shared with France. Look for Lausanne’s harbour, not another 4,000-metre summit. Bring a mop. — S.T."}};
const STOPS=[{"id": "at-redbull", "country": "at", "title": "Red Bull", "kind": "Headquarters", "place": "Fuschl am See", "mapQuery": "Red Bull headquarters Fuschl am See", "image": "red-bull.jpg", "intro": "The suspect ordered enough energy drinks to keep a snowman awake until July. A receptionist remembers a customer carrying a suspiciously cold suitcase.", "report": "Red Bull has its global headquarters in Fuschl am See, near Salzburg in Austria. Established in 1984, the company launched its energy drink in Austria in 1987. This location is a headquarters, not a canning factory. Headquarters coordinate activities such as management and international marketing; these belong to the service sector. A global brand can organise work across many different places. Fuschl is a small settlement rather than a major city; nearby Salzburg is an important regional city.", "notes": ["Fuschl am See: headquarters near Salzburg.", "Red Bull drink launched in Austria in 1987.", "Management and marketing belong to services."], "quiz": [{"type": "choice", "prompt": "Which activity would you most expect at this headquarters?", "options": ["Mining diamonds", "Coordinating international marketing", "Growing cocoa beans"], "answer": 1, "explain": "A headquarters coordinates the business. Management and marketing are service activities."}], "sources": [{"label": "Red Bull company profile", "url": "https://www.redbull.com/us-en/energydrink/company-profile"}, {"label": "Red Bull headquarters", "url": "https://jobs.redbull.com/ca-en/locations/red-bull-global-headquarters?lang=en"}], "evidence": "envelope", "discovery": "An envelope beside the fictional reception desk contains your evidence letter."}, {"id": "at-swarovski", "country": "at", "title": "Swarovski", "kind": "Factory", "place": "Wattens", "mapQuery": "Swarovski Wattens Austria", "image": "swarovski.jpg", "intro": "Someone tried to exchange a sack of snowflakes for cut crystals. The police have recovered a discarded packing label.", "report": "Daniel Swarovski established his crystal business in Wattens, Tyrol, in 1895. The Alpine location offered water power, while transport connections helped the company reach customers. Swarovski creates precision-cut crystal products: these are manufactured materials, not diamonds mined in the Alps. Production combines skilled work, technology and design. Manufacturing belongs to the secondary sector. Wattens shows that a small settlement can become the home of an internationally known industrial business, while its visitor attraction also brings service-sector activity.", "notes": ["Wattens, Tyrol: crystal manufacturing.", "Founded in 1895; water power helped the location.", "Manufacturing is secondary; tourism is tertiary."], "quiz": [{"type": "choice", "prompt": "Which location factor helped Swarovski develop in Wattens?", "options": ["Local diamond mines", "Tropical temperatures", "Water power"], "answer": 2, "explain": "Water supplied power for production; the crystals are manufactured rather than mined diamonds."}], "sources": [{"label": "Swarovski history", "url": "https://www.swarovski.com/en-US/s-the-history-of-swarovski"}], "evidence": "wall", "discovery": "A fictional mark on the packing-room wall reveals the letter."}, {"id": "at-innsbruck", "country": "at", "title": "Nordkette", "kind": "Ski and mountain tourism", "place": "Innsbruck", "mapQuery": "Nordkette Innsbruck", "image": "innsbruck.jpg", "intro": "The suspect asked whether a cable car could carry a small mountain of snow. A witness points to a fogged cabin window.", "report": "Innsbruck, the capital of Tyrol, lies in the Inn valley beneath high Alpine mountains. The Nordkette cableways connect the city with mountain recreation. The Hungerburgbahn opened in 1906; the higher Nordkette cableway sections followed in 1928. Winter skiing and summer hiking support jobs in transport, hotels, restaurants and equipment hire. These are service-sector activities. Tourism therefore links the physical landscape with the urban economy. Offering summer activities can also reduce dependence on a single winter season.", "notes": ["Innsbruck: Tyrol’s capital in the Inn valley.", "Nordkette supports winter and summer tourism.", "Hotels, lifts and equipment hire are services."], "quiz": [{"type": "choice", "prompt": "Which group consists mainly of service activities?", "options": ["Hotels, cable cars and equipment hire", "Steel production and machinery manufacturing", "Farming and forestry"], "answer": 0, "explain": "These businesses provide transport, accommodation and other services rather than extracting resources or manufacturing goods."}], "sources": [{"label": "Nordkette history", "url": "https://nordkette.com/en/top-of-innsbruck/history/"}], "evidence": "wall", "discovery": "A letter drawn on the fictional cable-car window becomes readable."}, {"id": "at-un", "country": "at", "title": "Vienna International Centre", "kind": "International organisations", "place": "Vienna", "mapQuery": "Vienna International Centre", "image": "un-vienna.jpg", "intro": "The suspect requested a diplomatic passport for a snowman. An abandoned conference badge has been handed to investigators.", "report": "Vienna is Austria’s capital and its largest city. The Vienna International Centre opened in 1979 on the side of the Danube opposite the historic city centre. It accommodates United Nations bodies and other international organisations, including the International Atomic Energy Agency. Its work involves diplomacy, international cooperation and technical expertise, not factory production. Government offices, conferences and international institutions support skilled service-sector employment. Vienna also attracts visitors through its museums, historic architecture and cultural life.", "notes": ["Vienna: capital and largest Austrian city.", "Vienna International Centre opened in 1979.", "Diplomacy and conferences are tertiary activities."], "quiz": [{"type": "choice", "prompt": "International conferences and diplomatic work belong mainly to which sector?", "options": ["Primary", "Secondary", "Tertiary"], "answer": 2, "explain": "They provide services and expertise, so they belong mainly to the tertiary sector."}], "sources": [{"label": "UN history of the Vienna International Centre", "url": "https://www.unov.org/unov/en/history-of-the-vienna-international-centre.html"}], "evidence": "envelope", "discovery": "The fictional conference-badge envelope contains a letter."}, {"id": "at-glock", "country": "at", "title": "GLOCK", "kind": "Factory", "place": "Deutsch-Wagram", "mapQuery": "GLOCK Deutsch-Wagram Austria", "image": "glock.jpg", "intro": "A driver reported a van labelled “precision-engineered snowballs”. The only evidence left behind is a fictional delivery docket.", "report": "Deutsch-Wagram lies northeast of Vienna in Lower Austria. Gaston Glock founded his company here in 1963. It initially produced consumer goods using materials including wood, metal and polymers and later became internationally known for firearms manufacturing. This investigation concerns the geography of industry: skilled labour, engineering, physical production and international sales. Manufacturing belongs to the secondary sector. The company provides an example of an industrial business based outside a national capital and selling to markets beyond Austria.", "notes": ["Deutsch-Wagram: industrial location northeast of Vienna.", "GLOCK was founded in 1963.", "Manufacturing and engineering contribute to exports."], "quiz": [{"type": "choice", "prompt": "Manufacturing physical products belongs mainly to which sector?", "options": ["Primary", "Secondary", "Tertiary"], "answer": 1, "explain": "Transforming materials into manufactured products is a secondary-sector activity."}], "sources": [{"label": "GLOCK company history", "url": "https://us.glock.com/en/about/history"}], "evidence": "envelope", "discovery": "A stamped letter is visible inside the fictional delivery env function quizHtml(qs,id){return `<form id="quiz-form" data-id="${id}">${qs.map((q,i)=>`<fieldset class="question"><legend>${i+1}. ${esc(q.prompt)}</legend>${q.type==='number'?`<label class="field"><span>Calculated answer ${q.unit?esc(q.unit):''}</span><input name="q${i}" type="text" inputmode="decimal" required placeholder="Type your answer"></label>`:q.type==='order'?`<ol class="orderlist">${q.items.map((_,j)=>`<li><select name="q${i}-${j}" required aria-label="Step ${j+1}"><option value="">Choose step ${j+1}</option>${q.items.map((it,k)=>`<option value="${k}">${esc(it)}</option>`).join('')}</select></li>`).join('')}</ol>`:`<div class="options">${q.options.map((op,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}" required><span>${esc(op)}</span></label>`).join('')}</div>`}<div id="feedback-${i}" class="feedback" role="status"></div></fieldset>`).join('')}<div class="row"><button type="submit">Check the evidence →</button><span class="smallprint">No timer and no penalty for revising a hypothesis.</span></div><div id="quiz-summary" class="feedback" role="status"></div><details><summary>Need a hint?</summary><p>Every answer is in the report or dossier above. Identify the exact supporting sentence before trying again. For density, divide the given population by total area and round to a whole number. For a sequence, use each event only once.</p></details></form>`;}
function solvedPanel(qs){return `<div class="successpanel"><div class="eyebrow">EVIDENCE VERIFIED</div><h3>Your interpretation checks out.</h3>${qs.map(q=>`<p>${esc(q.explain)}</p>`).join('')}</div>`;}
function terrainView(c,stage){const t=TERRAIN[c][stage],id=c+'-'+stage,qs=stage==='mountain'?[...t.quiz,geologyQ]:t.quiz;activeQuiz={id,qs};return `${bread(c,t.title)}<div class="eyebrow">TERRAIN UNIT / ${esc(c.toUpperCase())}-${stage==='mountain'?'01':'02'}</div><h1>${esc(t.title)}</h1><div class="two"><div>${photo(t.image,t.title)}${mapLinks(t.mapQuery)}${stage==='lowland'?`<div class="postcard"><div class="eyebrow">RECOVERED POSTCARD</div><blockquote>${esc(TERRAIN[c].postcard)}</blockquote><p class="smallprint">The suspect meant to post it. They dropped it instead.</p></div>`:''}</div><div><article class="report"><div class="eyebrow">OFFICIAL TERRAIN REPORT / OFFICER M. FROST</div>${para(t.report)}</article>${recordBox(t.notes)}${sources(t.sources)}</div></div>${stage==='mountain'?`<section class="section report"><div class="eyebrow">FORENSIC GEOLOGY UNIT</div><p>${esc(GEOLOGY)}</p><a class="smallprint" href="https://www.seismo.ethz.ch/en/news-and-services/bssed-imagewithtext/What-causes-earthquakes-in-Switzerland-Causes-Switzerland/" target="_blank" rel="noopener noreferrer">Geology source: Swiss Seismological Service ↗</a></section>`:''}<section class="quiz"><h2>Test your terrain hypothesis</h2>${state.solved[id]?solvedPanel(qs)+(stage==='mountain'?`<div class="postcard"><div class="eyebrow">NEW LEAD / A DROPPED POSTCARD</div><blockquote>${esc(TERRAIN[c].postcard)}</blockquote>${photo(TERRAIN[c].lowland.image,TERRAIN[c].lowland.title)}${action('I have made my notes — follow the postcard',`case/${c}/lowland`)}</div>`:`<div class="section">${action('I have made my notes — contact the population desk',`case/${c}/dossier`)}</div>`):quizHtml(qs,id)}</section>`;}
function dossierView(c){const d=COUNTRIES[c],id=c+'-dossier';activeQuiz={id,qs:d.quiz};let facts=[['Neighbours',d.neighbors.join(', ')],['Population',d.population.display+' · '+d.population.date],['Total area',d.area.toLocaleString('en-GB')+' km²'],['Nominal GDP',d.gdp],['Religion',d.religion],['Languages',d.languages],['Largest foreign-national group',d.migration],['Cities to locate',d.cities.join(', ')]];
return `${bread(c,'Population and economy desk')}<div class="eyebrow">POPULATION AND ECONOMY UNIT</div><h1>Who lives here?</h1><article class="report">${para(d.brief)}${para(d.economy)}</article><section class="section facts">${facts.map(([k,v])=>`<div class="fact"><b>${esc(k)}</b><span>${esc(v)}</span></div>`).join('')}</section><p class="smallprint">Case reference: 2024 / start of 2025, not live figures. Density = population ÷ total national area, rounded to the nearest person/km². “Foreign-national group” refers to citizenship among foreign residents, not ethnicity or all migration backgrounds. GDP is shown in local currencies; do not directly compare euro and franc amounts.</p><div class="maplinks">${d.cities.slice(0,3).map(city=>`<a class="button small secondary" href="${esc(mapUrl(city+' '+d.name))}" target="_blank" rel="noopener noreferrer">Locate ${esc(city)} ↗</a>`).join('')}</div>${recordBox(d.notes)}${sources(d.sources)}<section class="quiz"><h2>Clear the national evidence desk</h2>${state.solved[id]?solvedPanel(d.quiz)+`<div class="postcard"><div class="eyebrow">DISPATCH / NEW CONTACT</div><p>One witness has identified a suspicious order at <strong>${esc(stopsFor(c)[0].title)}</strong>. Your team is cleared to investigate.</p>${action('I have recorded the country facts — follow the lead',`case/${c}/${stopsFor(c)[0].id}`)}</div>`:quizHtml(d.quiz,id)}</section>`;}
function candleLetter(letter){const dots=[];for(let y=0;y<7;y++)for(let x=0;x<5;x++)if(y===0||y===6||x===2)dots.push(`<g transform="translate(${72+x*28} ${45+y*25})"><circle r="12" fill="#ffd375" opacity=".13"/><ellipse cy="3" rx="7" ry="4" fill="#c7bba6"/><ellipse cy="-3" rx="3" ry="6" fill="#ffdc8a"/><ellipse cy="-4" rx="1.5" ry="3" fill="#fff9dd"/></g>`);return `<svg width="260" height="250" viewBox="0 0 260 250" role="img" aria-label="Encoded letter ${letter} formed by candles">${dots.join('')}</svg>`;}
function clueHtml(s){return `<section class="clue"><div class="eyebrow">EVIDENCE FRAGMENT ${s.position} / 15</div><h2>${state.collected[s.id]?'Fragment secured.':'A letter was left behind.'}</h2><p>${esc(s.discovery)}</p>${state.collected[s.id]?`<div class="evidence-stage ${s.evidence}"><div class="evidence-tag">CASE 014 / POSITION ${String(s.position).padStart(2,'0')}</div>${s.evidence==='candles'?candleLetter(s.letter):`<div class="cipher-letter">${s.letter}</div>`}</div><p class="smallprint">Encoded letter ${s.letter} · Keep its position. It is not a letter of the name until decoded.</p>`:`<div class="evidence-stage ${s.evidence}"><button data-collect="${s.id}" style="position:relative;z-index:3">${s.evidence==='envelope'?'Open the evidence envelope':s.evidence==='candles'?'Examine the candle arrangement':'Inspect the marking'}</button></div>`}</section>`;}
function stopView(s){activeQuiz={id:s.id,qs:s.quiz};const arr=stopsFor(s.country),idx=arr.findIndex(x=>x.id===s.id),next=arr[idx+1];return `${bread(s.country,s.title)}<div class="eyebrow">SITE ${String(s.position).padStart(2,'0')} / ${esc(s.kind)}</div><h1>${esc(s.title)}</h1><p class="lead">${esc(s.intro)}</p><div class="two"><div>${photo(s.image,s.place)}${mapLinks(s.mapQuery)}</div><div><article class="report"><div class="eyebrow">ECONOMIC INTELLIGENCE / ${esc(s.place)}</div>${para(s.report)}</article>${recordBox(s.notes)}${sources(s.sources)}</div></div><section class="quiz"><h2>Resolve the lead</h2>${state.solved[s.id]?solvedPanel(s.quiz)+clueHtml(s)+(state.collected[s.id]?`<div class="row section">${action(next?'Notes recorded — next investigation site':'Country route complete — return to desk',next?`case/${s.country}/${next.id}`:'dashboard')}${action('Open notebook','notebook',true)}</div>`:''):quizHtml(s.quiz,s.id)}</section><p class="smallprint">This fictional investigation does not imply visitor access to private or industrial premises. Use the map for geography, not as an invitation to enter.</p>`;}
function strip(){return `<div class="cipher-strip" aria-label="Cipher fragments in position order">${Array.from({length:15},(_,i)=>{const s=STOPS[i],has=i===14?state.collected.initial:s&&state.collected[s.id];return `<div class="tile ${has?'':'blank'}"><small>${String(i+1).padStart(2,'0')}</small><b>${has?CIPHER[ALPHABET.indexOf(TARGET[i])]:'·'}</b></div>`;}).join('')}</div>`;}
function evidenceView(){const ready=STOPS.every(s=>state.collected[s.id])&&state.collected.initial;return `<div class="eyebrow">EVIDENCE ROOM / CASE 014</div><h1>A name in the snow.</h1><p class="lead">Keep the fragments in their numbered positions, not in the order you found them. Each symbol is an encoded letter.</p>${strip()}${!state.collected.initial?`<div class="card"><h3>The headquarters envelope is still unopened.</h3><button data-collect="initial">Recover fragment 15</button></div>`:''}${ready?`<section class="section report"><div class="eyebrow">FINAL FILE / SUBSTITUTION KEY UNLOCKED</div><h2>Decode the evidence</h2><p>Find your encoded letter on the top line of a key tile. The bold letter below is its decoded value. Repeated symbols always represent the same letter. Example: <strong>W → B</strong>. Add a space after the eighth decoded letter; accents were omitted in transmission.</p><div class="keytable">${[...CIPHER].map((l,i)=>`<div class="keycell"><span>${l} ↓</span><b>${ALPHABET[i]}</b></div>`).join('')}</div><form id="accuse-form"><label class="field"><span>Full name of the snow thief</span><input type="text" name="culprit" autocomplete="off" required placeholder="First name and surname"></label><button type="submit">Submit the final accusation</button><div id="accuse-feedback" class="feedback" role="status"></div></form></section>${state.won?ending():''}`:`<section class="card section"><h3>The decoding key is sealed.</h3><p>Finish all 14 investigation sites and collect the headquarters fragment to open it. ${14-completeCount()} site${14-completeCount()===1?'':'s'} still need investigation.</p>${action('Return to routes','dashboard')}</section>`}`;}
function ending(){return `<section class="successpanel" id="ending"><div class="eyebrow">CASE CLOSED / CONFESSION RECORDED</div><h2>Jindřich Havelka.</h2><p class="lead">Your teacher stole the snow.</p><div class="two"><div><p>“Yes, it was me. I needed enough snow to cancel Monday’s lessons. Unfortunately, I put it next to the classroom radiator.”</p><p>The emergency freezer contained three melted snowballs, a timetable and an unpaid electricity bill. No glaciers were harmed in the making of this fictional case.</p><h3>Before you close the case</h3><p>Compare a mountain and a lower landscape. Explain one reason for settlement in valleys and one difference between the three economies. Check that your notebook includes the required cities and country facts.</p>${action('Finish the investigation notebook','notebook')}</div><div>${photo('teacher.jpg','The suspect identified by the Alpine Police')}</div></div></section>`;}
function noteField(key,label,placeholder){return `<label class="field"><span>${esc(label)}</span><textarea data-note="${key}" placeholder="${esc(placeholder)}">${esc(state.notes[key]||'')}</textarea></label>`;}
function notebook(){return `<div class="eyebrow">TEAM ${esc(state.team)} / INVESTIGATION NOTEBOOK</div><h1>Your geographical evidence.</h1><p class="lead">This is your own record, not an automatically completed answer sheet. Notes save on this browser as you type. Export a backup to keep them or move to another device.</p><div class="row no-print"><button data-export="json">Export progress backup</button><button class="secondary" data-export="txt">Download notes as text</button><button class="secondary" data-print>Print these notes</button><a class="button secondary" href="investigation-notebook.html" target="_blank">Blank paper notebook ↗</a></div><section class="section card">${noteField('geology','How the Alps formed','Explain convergence, collision, folding and uplift. Distinguish mountain building from river and glacier erosion.')}</section>${COUNTRY_IDS.map(c=>`<section class="section card notebook-country"><div class="eyebrow">${COUNTRIES[c].code}</div><h2>${esc(COUNTRIES[c].name)}</h2>${noteField(c+'-terrain','Physical geography and the postcard comparison','Record both sites, elevation, relief, temperature/climate, vegetation and rivers. What changed between mountain and lower ground?')}${noteField(c+'-facts','People and country facts','Neighbours; population and date; area; density calculation; GDP, currency and year; religion; largest foreign-national group; official/national languages; major cities.')}${noteField(c+'-economy','Economic activities and visited settlements','For each site: town, organisation/brand, historical fact, economic activity and what your task demonstrated.')}${noteField(c+'-culture','Culture, tourism and institutions','Record winter/summer tourism, heritage or international cooperation. How do they connect with local jobs?')}<details><summary>Review unlocked records</summary>${unlockedNotes(c)}</details></section>`).join('')}`;}
function unlockedNotes(c){let a=[];for(const stage of ['mountain','lowland'])if(state.solved[c+'-'+stage])a.push(`<h4>${esc(TERRAIN[c][stage].title)}</h4><ul>${TERRAIN[c][stage].notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`);if(state.solved[c+'-dossier'])a.push(`<h4>Country dossier</h4><ul>${COUNTRIES[c].notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`);for(const s of stopsFor(c))if(state.collected[s.id])a.push(`<h4>${esc(s.title)}</h4><ul>${s.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`);return a.join('')||'<p>No records filed yet. Begin at the mountain scene.</p>';}
function help(){return `<div class="eyebrow">CASE PROCEDURES</div><h1>Field instructions.</h1><div class="card"><h3>How to investigate</h3><ol><li>Choose any of the three country routes.</li><li>Read the mountain report, observe the image and map, then answer the terrain questions.</li><li>Follow the postcard into a contrasting lower landscape.</li><li>Clear the country dossier. Use its dated figures, not a live search result.</li><li>Visit each unlocked organisation, solve its task and physically open/inspect the clue to collect a letter.</li><li>Keep your notebook up to date and use the evidence board to decode the final name.</li></ol><h3>Four detectives, four roles</h3><p>Navigator operates Maps and the route. Reader reads the police report. Recorder writes the notebook. Fact-checker checks reasoning and units. Rotate after each country.</p><h3>Saved progress</h3><p>Progress is stored only in this browser on this device. Private browsing and clearing website data may erase it. It is not synchronised between tablets. Export a backup at the end of a lesson; import it to continue elsewhere.</p><div class="row"><button data-export="json">Export backup</button><label class="button secondary" for="import-file">Import backup</label><input class="sr-only" type="file" id="import-file" accept="application/json,.json"><button class="secondary" data-reset>Start a new case</button></div><div id="import-feedback" class="feedback" role="status"></div><h3 style="margin-top:25px">Maps and images</h3><p>Google Maps opens separately. Street View coverage varies. If unavailable, satellite view and the supplied reports are sufficient. A generic illustration is labelled as a placeholder and is not location evidence.</p><h3>Source definitions</h3><p>Density uses total area. Foreign-national groups use citizenship. Swiss national languages and federal official-language rules are not identical. GDP values use local currencies. Religion describes traditions and affiliations, not every resident’s beliefs.</p><p class="smallprint">The story, police officers and clues are fictional. Companies are not sponsors or partners. Real glacier loss is not caused by a fictional snow thief.</p></div>`;}
let activeQuiz=null;
function render(){activeQuiz=null;const route=location.hash.slice(1)||'dashboard',parts=route.split('/');let html;
if(!state.team)html=intro();else if(parts[0]==='country'&&COUNTRIES[parts[1]])html=countryView(parts[1]);else if(parts[0]==='case'&&COUNTRIES[parts[1]]){const [_,c,stage]=parts;if(!routeAllowed(c,stage))html=`<div class="card locked"><h1>Evidence sealed.</h1><p>Follow the earlier leads on this country’s route first.</p>${action('Back to route','country/'+c)}</div>`;else if(stage==='mountain'||stage==='lowland')html=terrainView(c,stage);else if(stage==='dossier')html=dossierView(c);else if(stopById[stage])html=stopView(stopById[stage]);else html=dashboard();}else if(route==='evidence')html=evidenceView();else if(route==='notebook')html=notebook();else if(route==='help')html=help();else html=dashboard();
document.getElementById('app').innerHTML=html;document.getElementById('team-status').textContent=state.team?`${state.team} · ${completeCount()}/14 sites`:'';document.body.classList.toggle('no-snow',!state.snow);document.getElementById('snow-toggle').textContent=state.snow?'Snow off':'Snow on';storageNotice();document.title='The Snow Thief · Alpine Police';window.scrollTo(0,0);}
function numeric(s){const v=String(s).trim().replace(',','.');return /^-?\d+(?:\.\d+)?$/.test(v)?Number(v):NaN;}
function checkAnswer(q,values){if(q.type==='number'){const n=numeric(values);return Number.isFinite(n)&&Math.abs(n-q.answer)<=(q.tolerance??0);}if(q.type==='order')return Array.isArray(values)&&q.answer.every((a,i)=>String(a)===values[i]);return String(q.answer)===values;}
document.addEventListener('submit',e=>{if(e.target.id==='team-form'){e.preventDefault();const name=new FormData(e.target).get('team').trim();if(!name)return;state.team=name.slice(0,60);save();go('dashboard');return;}if(e.target.id==='quiz-form'){e.preventDefault();if(!activeQuiz)return;const {id,qs}=activeQuiz,fd=new FormData(e.target);let all=true;qs.forEach((q,i)=>{const vals=q.type==='order'?q.items.map((_,j)=>fd.get(`q${i}-${j}`)):fd.get('q'+i);const ok=checkAnswer(q,vals);all=all&&ok;const f=document.getElementById('feedback-'+i);f.className='feedback '+(ok?'success':'error');f.textContent=ok?'Evidence supported.':q.type==='number'?'Recheck the figures, units and rounding in the dossier.':'This conclusion is not supported. Return to the report and check the relevant detail.';});if(all){state.solved[id]=true;save();render();const panel=document.querySelector('.successpanel');panel?.scrollIntoView({behavior:'smooth',block:'start'});}else{const f=document.getElementById('quiz-summary');f.className='feedback error';f.textContent='Some evidence needs another look. Correct responses remain selected.';document.querySelector('.feedback.error')?.scrollIntoView({behavior:'smooth',block:'center'});}return;}if(e.target.id==='accuse-form'){e.preventDefault();const raw=new FormData(e.target).get('culprit'),n=raw.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z]/g,'');if(n===TARGET){state.won=true;save();render();document.getElementById('ending')?.scrollIntoView({behavior:'smooth'});}else{const f=document.getElementById('accuse-feedback');f.className='feedback error';f.textContent='The decoded name does not match the evidence. Use positions 01–15 and decode top symbol → bottom letter. Add a space after letter 8.';}}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-go],[data-collect],[data-export],[data-reset],[data-print]');if(!el)return;if(el.dataset.go){go(el.dataset.go);return;}if(el.dataset.collect){const id=el.dataset.collect;if(id==='initial'||state.solved[id]){state.collected[id]=true;save();const y=window.scrollY;render();window.scrollTo(0,y);}return;}if(el.dataset.export){download(el.dataset.export);return;}if(el.hasAttribute('data-print')){window.print();return;}if(el.hasAttribute('data-reset')){const modal=document.createElement('div');modal.className='modal';modal.innerHTML='<div role="dialog" aria-modal="true" aria-labelledby="reset-title"><h2 id="reset-title">Start a new case?</h2><p>This removes this device’s current progress and notes. Export a backup first if you want to keep them.</p><div class="row"><button id="cancel-reset">Keep this case</button><button class="secondary" id="confirm-reset">Erase and restart</button></div></div>';document.body.append(modal);const cancel=()=>{modal.remove();el.focus();};modal.querySelector('#cancel-reset').onclick=cancel;modal.querySelector('#confirm-reset').onclick=()=>{state=initialState();save();modal.remove();go('dashboard');};modal.addEventListener('keydown',ev=>{if(ev.key==='Escape')cancel();if(ev.key==='Tab'){const buttons=modal.querySelectorAll('button');if(ev.shiftKey&&document.activeElement===buttons[0]){ev.preventDefault();buttons[1].focus();}else if(!ev.shiftKey&&document.activeElement===buttons[1]){ev.preventDefault();buttons[0].focus();}}});modal.querySelector('button').focus();}});
document.addEventListener('input',e=>{if(e.target.matches('[data-note]')){state.notes[e.target.dataset.note]=e.target.value.slice(0,15000);save();}});
document.addEventListener('change',async e=>{if(e.target.id!=='import-file')return;const f=e.target.files[0];if(!f)return;const msg=document.getElementById('import-feedback');try{if(f.size>350000)throw Error('The backup file is too large.');const imported=validateState(JSON.parse(await f.text()));if(!confirm('Replace the current progress and notes with this backup? Export the current case first if needed.'))return;state=imported;save();go('dashboard');}catch(err){msg.className='feedback error';msg.textContent='Import failed: '+err.message;}e.target.value='';});
function download(type){let data,mime,name;if(type==='json'){data=JSON.stringify(state,null,2);mime='application/json';name='snow-thief-progress.json';}else{data=`THE SNOW THIEF\nTeam: ${state.team}\n\nALPINE FORMATION\n${state.notes.geology||''}\n\n`+COUNTRY_IDS.map(c=>`${COUNTRIES[c].name.toUpperCase()}\n`+['terrain','facts','economy','culture'].map(k=>`${k.toUpperCase()}\n${state.notes[c+'-'+k]||''}`).join('\n\n')).join('\n\n')+`\n\nCipher: ${[...TARGET].map((l,i)=>i===14?(state.collected.initial?CIPHER[ALPHABET.indexOf(l)]:'_'):(state.collected[STOPS[i].id]?CIPHER[ALPHABET.indexOf(l)]:'_')).join(' ')}\n`;mime='text/plain;charset=utf-8';name='snow-thief-notes.txt';}const url=URL.createObjectURL(new Blob([data],{type:mime}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);}
document.getElementById('snow-toggle').onclick=()=>{state.snow=!state.snow;save();document.body.classList.toggle('no-snow',!state.snow);document.getElementById('snow-toggle').textContent=state.snow?'Snow off':'Snow on';};
const snow=document.getElementById('snow');for(let i=0;i<32;i++){const dot=document.createElement('i');dot.style.left=((i*37)%100)+'%';dot.style.animationDuration=(13+(i%9)*2)+'s';dot.style.animationDelay=(-i*1.7)+'s';snow.append(dot);}
window.addEventListener('hashchange',render);render();

window.addEventListener('beforeprint',()=>{document.querySelectorAll('[data-note]').forEach(t=>{const d=document.createElement('div');d.className='print-note';d.textContent=t.value||' ';t.after(d);});});
window.addEventListener('afterprint',()=>document.querySelectorAll('.print-note').forEach(d=>d.remove()));
</script></body></html>
